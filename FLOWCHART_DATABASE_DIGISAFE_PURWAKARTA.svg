    <text x="1532" y="908" fill="#DB2777" font-size="11" font-weight="700">🔗 jawaban_id → jawaban_forum.id</text>
    <text x="1532" y="927" fill="#DB2777" font-size="11" font-weight="700">🔗 user_id → users.id</text>
