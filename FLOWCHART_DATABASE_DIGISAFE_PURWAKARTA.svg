<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1850 1280" width="1850" height="1280" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="fk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="pk-dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="4" fill="#0284C7"/>
    </marker>
  </defs>

  <rect id="bg" x="0" y="0" width="1850" height="1280" fill="#F8FAFC"/>

  <!-- Header -->
  <g id="db-header">
    <rect x="40" y="24" width="1770" height="82" rx="18" fill="#0F172A"/>
    <text x="925" y="60" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="800">ARSITEKTUR &amp; FLOWCHART RELASI DATABASE (ERD) — DIGI-SAFE PURWAKARTA</text>
    <text x="925" y="88" text-anchor="middle" fill="#38BDF8" font-size="14" font-weight="600">Engine InnoDB (utf8mb4_unicode_ci) • Pusat Entitas: USERS • 13 Foreign Key Aktif • Relasi 1:1, 1:N, dan N:M</text>
  </g>

  <!-- CORE TABLE: USERS (CENTER) -->
  <g id="table-users">
    <rect x="735" y="470" width="380" height="270" rx="16" fill="#FFFFFF" stroke="#0284C7" stroke-width="3"/>
    <rect x="735" y="470" width="380" height="44" rx="16" fill="#0284C7"/>
    <text x="925" y="498" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">TABEL PUSAT: users</text>
    <text x="755" y="538" fill="#0F172A" font-size="12.5" font-weight="700">🔑 id (BIGINT PK, Auto Increment)</text>
    <text x="755" y="560" fill="#334155" font-size="12">• username (VARCHAR 50, UNIQUE)</text>
    <text x="755" y="582" fill="#334155" font-size="12">• email (VARCHAR 100, UNIQUE)</text>
    <text x="755" y="604" fill="#334155" font-size="12">• password (Bcrypt/Argon2id Hash)</text>
    <text x="755" y="626" fill="#0284C7" font-size="12" font-weight="700">• role ('owner' | 'admin' | 'user')</text>
    <text x="755" y="648" fill="#334155" font-size="12">• oauth_provider / oauth_id (Google OAuth)</text>
    <text x="755" y="670" fill="#334155" font-size="12">• avatar, banner, avatar_border (Tier 1-5)</text>
    <text x="755" y="692" fill="#334155" font-size="12">• locale ('id'|'en'), theme ('light'|'dark')</text>
    <text x="755" y="714" fill="#475569" font-size="11.5">• privacy_settings (JSON), badge_json (JSON)</text>
  </g>

  <!-- CLUSTER 1 (TOP LEFT): KEAMANAN & OTENTIKASI -->
  <g id="cluster-security">
    <rect x="40" y="135" width="530" height="310" rx="18" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <rect x="40" y="135" width="530" height="38" rx="18" fill="#D97706"/>
    <text x="305" y="160" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">1. MODUL KEAMANAN, OTP &amp; API TOKEN</text>

    <rect x="60" y="188" width="235" height="114" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
    <text x="177" y="210" text-anchor="middle" fill="#92400E" font-size="13" font-weight="800">account_otps</text>
    <text x="72" y="232" fill="#334155" font-size="11">🔑 id (PK)</text>
    <text x="72" y="249" fill="#334155" font-size="11">• email, purpose (reset/delete)</text>
    <text x="72" y="266" fill="#334155" font-size="11">• code_hash (Bcrypt Hash)</text>
    <text x="72" y="283" fill="#334155" font-size="11">• attempts, expires_at, consumed_at</text>

    <rect x="315" y="188" width="235" height="114" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
    <text x="432" y="210" text-anchor="middle" fill="#92400E" font-size="13" font-weight="800">api_tokens (Flutter)</text>
    <text x="327" y="232" fill="#334155" font-size="11">🔑 id (PK) | 🔗 user_id (FK)</text>
    <text x="327" y="249" fill="#334155" font-size="11">• name ('flutter_google')</text>
    <text x="327" y="266" fill="#334155" font-size="11">• token (SHA-256 Hash)</text>
    <text x="327" y="283" fill="#334155" font-size="11">• last_used_at, expires_at</text>

    <rect x="60" y="316" width="235" height="112" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
    <text x="177" y="338" text-anchor="middle" fill="#92400E" font-size="13" font-weight="800">security_activity_logs</text>
    <text x="72" y="360" fill="#334155" font-size="11">🔑 id (PK) | 🔗 user_id (FK)</text>
    <text x="72" y="377" fill="#334155" font-size="11">• event_type (login/reset/google)</text>
    <text x="72" y="394" fill="#334155" font-size="11">• ip_address, device_label</text>
    <text x="72" y="411" fill="#334155" font-size="11">• user_agent, created_at</text>

    <rect x="315" y="316" width="235" height="112" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
    <text x="432" y="338" text-anchor="middle" fill="#92400E" font-size="13" font-weight="800">sessions &amp; log_aktivitas</text>
    <text x="327" y="360" fill="#334155" font-size="11">🔑 id (PK) | 🔗 user_id (FK)</text>
    <text x="327" y="377" fill="#334155" font-size="11">• payload, last_activity</text>
    <text x="327" y="394" fill="#334155" font-size="11">• ip_address, user_agent</text>
    <text x="327" y="411" fill="#334155" font-size="11">• Dihapus otomatis saat reset pwd</text>
  </g>

  <!-- CLUSTER 2 (TOP RIGHT): LITERASI & EDUKASI -->
  <g id="cluster-edukasi">
    <rect x="1280" y="135" width="530" height="310" rx="18" fill="#EFF6FF" stroke="#38BDF8" stroke-width="2"/>
    <rect x="1280" y="135" width="530" height="38" rx="18" fill="#0284C7"/>
    <text x="1545" y="160" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">2. MODUL LITERASI &amp; KURIKULUM EDUKASI</text>

    <rect x="1300" y="188" width="240" height="118" rx="10" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
    <text x="1420" y="210" text-anchor="middle" fill="#0369A1" font-size="13" font-weight="800">modul_edukasi</text>
    <text x="1312" y="232" fill="#334155" font-size="11">🔑 id (PK)</text>
    <text x="1312" y="249" fill="#334155" font-size="11">• judul, kategori, type ('teks'|'link')</text>
    <text x="1312" y="266" fill="#334155" font-size="11">• konten (LONGTEXT), link_url</text>
    <text x="1312" y="283" fill="#0284C7" font-size="11" font-weight="700">🔗 created_by → users.id</text>

    <rect x="1555" y="188" width="235" height="118" rx="10" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
    <text x="1672" y="210" text-anchor="middle" fill="#0369A1" font-size="13" font-weight="800">progres_baca</text>
    <text x="1567" y="232" fill="#334155" font-size="11">🔑 id (PK)</text>
    <text x="1567" y="249" fill="#0284C7" font-size="11" font-weight="700">🔗 user_id → users.id</text>
    <text x="1567" y="266" fill="#0284C7" font-size="11" font-weight="700">🔗 modul_id → modul_edukasi.id</text>
    <text x="1567" y="283" fill="#334155" font-size="11">• selesai (BOOL), dibaca_pada</text>

    <rect x="1300" y="320" width="490" height="108" rx="10" fill="#FFFFFF" stroke="#7DD3FC" stroke-width="1.5"/>
    <text x="1545" y="342" text-anchor="middle" fill="#0369A1" font-size="13" font-weight="800">edukasi_requests (Evaluasi Usulan Topik + Bot Digika)</text>
    <text x="1315" y="364" fill="#334155" font-size="11">🔑 id (PK)  |  🔗 user_id → users.id  |  🔗 reviewed_by → users.id</text>
    <text x="1315" y="383" fill="#334155" font-size="11">• tema, kategori, alasan, status ('pending' | 'approved' | 'rejected'), admin_note</text>
    <text x="1315" y="402" fill="#059669" font-size="11" font-weight="600">→ Saat status berubah, Bot Digika otomatis insert pesan ke tabel chat_messages</text>
  </g>

  <!-- CLUSTER 3 (BOTTOM LEFT): GAMIFIKASI, MINIGAME & DAILY STREAK -->
  <g id="cluster-gamifikasi">
    <rect x="40" y="790" width="840" height="450" rx="18" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <rect x="40" y="790" width="840" height="38" rx="18" fill="#059669"/>
    <text x="460" y="815" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="800">3. MODUL GAMIFIKASI: MINIGAME, LENCANA &amp; DAILY STREAK</text>

    <rect x="60" y="845" width="250" height="120" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="185" y="867" text-anchor="middle" fill="#065F46" font-size="13" font-weight="800">skor_game</text>
    <text x="72" y="889" fill="#334155" font-size="11">🔑 id (PK) | 🔗 user_id → users.id</text>
    <text x="72" y="906" fill="#334155" font-size="11">• game_type (phishing, link-trap,</text>
    <text x="72" y="921" fill="#334155" font-size="11">  cyber-defender, wa-simulator,</text>
    <text x="72" y="936" fill="#334155" font-size="11">  panic-simulator, daily-streak)</text>
    <text x="72" y="953" fill="#059669" font-size="11" font-weight="700">• skor, skor_tertinggi, benar, salah</text>

    <rect x="330" y="845" width="255" height="120" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="457" y="867" text-anchor="middle" fill="#065F46" font-size="13" font-weight="800">soal_minigame &amp; levels</text>
    <text x="342" y="889" fill="#334155" font-size="11">🔑 id (PK)</text>
    <text x="342" y="906" fill="#334155" font-size="11">• game_level, tingkat (easy-master)</text>
    <text x="342" y="923" fill="#334155" font-size="11">• pilihan_json (Opsi A-D)</text>
    <text x="342" y="940" fill="#334155" font-size="11">• jawaban_benar (Validasi Server)</text>

    <rect x="605" y="845" width="255" height="120" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="732" y="867" text-anchor="middle" fill="#065F46" font-size="13" font-weight="800">badges &amp; user_badges</text>
    <text x="617" y="889" fill="#334155" font-size="11">🔑 badges.id (PK)</text>
    <text x="617" y="906" fill="#334155" font-size="11">• nama_badge, kriteria_skor</text>
    <text x="617" y="926" fill="#059669" font-size="11" font-weight="700">🔗 user_badges.user_id → users.id</text>
    <text x="617" y="943" fill="#059669" font-size="11" font-weight="700">🔗 user_badges.badge_id → badges.id</text>

    <rect x="60" y="982" width="265" height="236" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="192" y="1005" text-anchor="middle" fill="#065F46" font-size="13" font-weight="800">user_daily_streaks (1:1)</text>
    <text x="72" y="1028" fill="#334155" font-size="11">🔑 id (PK) | 🔗 user_id (UNIQUE)</text>
    <text x="72" y="1047" fill="#334155" font-size="11">• current_streak (Hari beruntun)</text>
    <text x="72" y="1066" fill="#334155" font-size="11">• longest_streak (Rekor)</text>
    <text x="72" y="1085" fill="#0284C7" font-size="11" font-weight="700">• freeze_recovery_left (Max 2x)</text>
    <text x="72" y="1104" fill="#334155" font-size="11">• status (idle|active|frozen|broken)</text>
    <text x="72" y="1123" fill="#334155" font-size="11">• last_completed_at (Aturan 24 Jam)</text>
    <text x="72" y="1142" fill="#334155" font-size="11">• weekly_days_json (Strip Sen-Min)</text>

    <rect x="345" y="982" width="250" height="236" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="470" y="1005" text-anchor="middle" fill="#065F46" font-size="13" font-weight="800">user_daily_streak_logs</text>
    <text x="357" y="1028" fill="#334155" font-size="11">🔑 id (PK) | 🔗 user_id (FK)</text>
    <text x="357" y="1047" fill="#334155" font-size="11">• challenge_date (YYYY-MM-DD)</text>
    <text x="357" y="1066" fill="#334155" font-size="11">• question_key</text>
    <text x="357" y="1085" fill="#334155" font-size="11">• selected_option ('A'-'E')</text>
    <text x="357" y="1104" fill="#334155" font-size="11">• is_correct (BOOL)</text>
    <text x="357" y="1123" fill="#334155" font-size="11">• used_freeze_recovery (BOOL)</text>
    <text x="357" y="1152" fill="#D97706" font-size="10.5" font-weight="700">Hitung $wrongToday → Anti-Brute</text>

    <rect x="615" y="982" width="245" height="236" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="737" y="1005" text-anchor="middle" fill="#065F46" font-size="13" font-weight="800">daily_streak_questions</text>
    <text x="627" y="1028" fill="#334155" font-size="11">🔑 id (PK) | question_key (UK)</text>
    <text x="627" y="1047" fill="#334155" font-size="11">• category_id / category_en</text>
    <text x="627" y="1066" fill="#334155" font-size="11">• prompt_id / prompt_en</text>
    <text x="627" y="1085" fill="#334155" font-size="11">• options_id_json (A-E)</text>
    <text x="627" y="1104" fill="#334155" font-size="11">• options_en_json (A-E)</text>
    <text x="627" y="1123" fill="#334155" font-size="11">• answer ('A'-'E'), is_active</text>
    <text x="627" y="1152" fill="#059669" font-size="10.5" font-weight="700">Dipilih via Hash crc32(tanggal)</text>
  </g>

