    <text x="1532" y="968" fill="#059669" font-size="10.5" font-weight="700">Hitung Net Score → Most Helpful</text>

    <rect x="940" y="1015" width="275" height="202" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.5"/>
    <text x="1077" y="1038" text-anchor="middle" fill="#9D174D" font-size="13" font-weight="800">testimoni &amp; reactions</text>
