<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Digi-Safe Purwakarta</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F8FAFC;
            color: #0F172A;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 24px;
        }
        .card {
            max-width: 420px;
            width: 100%;
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 24px;
            padding: 32px 28px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
        }
        .logo {
            width: 56px;
            height: 56px;
            object-fit: contain;
            margin: 0 auto 16px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        p {
            margin: 0 0 22px;
            font-size: 13.5px;
            line-height: 1.6;
            color: #475569;
        }
        button {
            border: none;
            background: #0F172A;
            color: #FFFFFF;
            font-weight: 700;
            font-size: 13px;
            padding: 12px 24px;
            border-radius: 999px;
            cursor: pointer;
        }
        button:hover {
            background: #1E63E9;
        }
    </style>
</head>
<body>
    <main class="card">
        <img src="/images/logo.png" alt="Digi-Safe Purwakarta" class="logo">
        <h1>Koneksi Internet Terputus</h1>
        <p>Anda sedang dalam mode offline. Periksa sambungan Wi-Fi atau data seluler Anda, lalu muat ulang halaman Digi-Safe Purwakarta.</p>
        <button type="button" onclick="window.location.reload()">Muat Ulang Halaman</button>
    </main>
</body>
</html>
